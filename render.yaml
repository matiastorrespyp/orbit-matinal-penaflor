###############################################################
# ORBIT PAV Matinal · Peñaflor — Render deployment config
# https://render.com/docs/yaml-spec
###############################################################

services:
  - type: web
    name: orbit-matinal-penaflor
    runtime: python
    plan: starter           # requiere Persistent Disk para no perder planificaciones

    # Build
    buildCommand: pip install -r requirements.txt

    # Start — gunicorn sirve la app Flask
    # 1 worker = sin conflictos de escritura en SQLite
    startCommand: >
      gunicorn server_orbit:app
      --bind 0.0.0.0:$PORT
      --timeout 120
      --workers 1
      --worker-class sync

    # Environment variables
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ORBIT_DB_PATH
        value: /var/data/orbit.db
      - key: ORBIT_PLAN_BACKUP_DIR
        value: /var/data/planificacion

    # Health check — endpoint liviano, sin leer archivos de datos
    healthCheckPath: /api/healthz

    disk:
      name: orbit-data
      mountPath: /var/data
      sizeGB: 1

    # Auto-deploy activado — cada push a master despliega automaticamente.
    # orbit.db se commitea con planes sincronizados antes de cada push.
    branch: master
    autoDeploy: true
